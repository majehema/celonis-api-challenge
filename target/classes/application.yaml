swagger: '2.0'
info:
  description: 'Challenge 1: API Design'
  version: 1.0.0
  title: 'Challenge 1: API Design'
host: localhost:8000
basePath: /api
schemes:
  - https
paths:
  /applications:
    get:
      tags:
        - applications
      summary: list all applications
      description: ''
      operationId: listApplications
      produces:
        - application/json
      responses:
        '200':
          description: successful operation
          schema:
            type: array
            items:
              $ref: '#/definitions/ProjectGenerationApplication'
    post:
      tags:
        - applications
      summary: create a new application
      description: ''
      operationId: createApplication
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: application to create
          required: true
          schema:
            $ref: '#/definitions/ProjectGenerationApplication'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ProjectGenerationApplication'
        '405':
          description: Invalid input
  '/applications/{id}':
    get:
      tags:
        - applications
      summary: get an application by id
      description: ''
      operationId: getApplication
      parameters:
        - name: id
          in: path
          description: id of application to return
          required: true
          type: integer
          format: int64
      produces:
        - application/json
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ProjectGenerationApplication'
        '404':
          description: not found
    put:
      tags:
        - applications
      summary: update an application by id
      description: ''
      operationId: updateApplication
      parameters:
        - name: id
          in: path
          description: id of application to update
          required: true
          type: integer
          format: int64
        - in: body
          name: body
          description: updated application
          required: true
          schema:
            $ref: '#/definitions/ProjectGenerationApplication'
      consumes:
        - application/json
      produces:
        - application/json
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ProjectGenerationApplication'
        '404':
          description: not found
        '405':
          description: invalid input
    delete:
      tags:
        - applications
      summary: delete a application by id
      description: ''
      operationId: deleteApplication
      parameters:
        - name: id
          in: path
          description: id of application to delete
          required: true
          type: integer
          format: int64
      responses:
        '204':
          description: successful operation
        '404':
          description: not found
definitions:
  ProjectGenerationApplication:
    type: object
    properties:
      id:
        type: integer
        format: int64
      cv_storage:
        type: string
      personal_details:
        $ref: '#/definitions/PersonalDetails'
      essay:
        type: string
  PersonalDetails:
    type: object
    properties:
      first_name:
        type: string
      last_name:
        type: string
      age:
        type: integer
      email:
        type: string
        format: email
      phone:
        type: string
      address:
        type: string
      zip_code:
        type: string
      country: 
        type: string
        
        